[package]
name = "adapter-platform-macos"
version.workspace = true
description = "macOS native capability implementation and retained resource bridge"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
links = "lens_native"

[build-dependencies]
cc = "=1.5.1"

[dependencies]
port-platform.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio = { version = "=1.53.2", features = ["sync"] }
macos-accessibility-client = "=0.0.2"
screencapturekit = { version = "=11.0.0", features = ["async", "macos_15_2"] }
dispatch2 = "=0.3.1"
objc2 = "=0.6.4"
objc2-foundation = "=0.3.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
  "std",
  "NSScreen",
  "objc2-core-foundation",
] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[[test]]
name = "native_boundary_lifecycle"
path = "tests/native_boundary_lifecycle.rs"
harness = false

[lints]
workspace = true
