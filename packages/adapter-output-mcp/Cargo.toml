[package]
name = "adapter-output-mcp"
version = "0.1.0"
description = "Lens embedded static HTML publication MCP server"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rmcp = { version = "=3.2.0", default-features = false, features = [
  "server",
  "macros",
  "transport-streamable-http-server",
] }
axum = "0.8"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio = { version = "1", features = ["net", "rt", "macros"] }
tokio-util = "0.7"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["time", "io-util"] }
