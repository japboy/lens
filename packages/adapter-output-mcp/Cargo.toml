[package]
name = "adapter-output-mcp"
version = "0.1.0"
description = "Lens static HTML publication MCP server"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "lens-output-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "=3.2.0", default-features = false, features = [
  "server",
  "macros",
  "transport-io",
] }
serde.workspace = true
uuid.workspace = true
tokio = { version = "1", features = ["io-util", "io-std", "rt", "macros"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { version = "1", features = ["time"] }
