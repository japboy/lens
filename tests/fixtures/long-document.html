<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lens Accessibility Long Document Fixture</title>
    <style>
      body { max-width: 48rem; margin: 2rem auto; font: 18px/1.7 -apple-system, sans-serif; }
      section { margin-block: 3rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Lens Accessibility Long Document Fixture</h1>
      <p id="viewport-marker">LENS_VIEWPORT_START_MARKER</p>
      <div id="content"></div>
      <section aria-labelledby="final-heading">
        <h2 id="final-heading">End of Off-Viewport Validation</h2>
        <p id="offscreen-marker">LENS_OFFSCREEN_END_MARKER_9F3A7C</p>
      </section>
    </main>
    <script>
      const content = document.querySelector("#content");
      for (let index = 1; index <= 240; index += 1) {
        const section = document.createElement("section");
        const heading = document.createElement("h2");
        heading.textContent = `Validation Section ${index}`;
        const paragraph = document.createElement("p");
        paragraph.textContent = `Validation paragraph ${index} for accessibility-tree extraction outside the visible viewport. This paragraph simulates a meaningful long-form web document.`;
        section.append(heading, paragraph);
        content.append(section);
      }
    </script>
  </body>
</html>
