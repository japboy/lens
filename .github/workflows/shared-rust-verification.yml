name: Shared Rust Verification

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact verified source; defaults to the caller revision for ordinary CI.
        type: string
        default: ""
      release_tag:
        description: Admitted release tag; permits complete legacy source verification without cache reuse.
        type: string
        default: ""
      frontend_artifact:
        description: Same-workflow frontend artifact; empty only for standalone verification.
        type: string
        default: ""
      cache_policy:
        description: "Cache authority: read-only, pull-request, or main-seed."
        type: string
        default: read-only

permissions:
  contents: read

jobs:
  shared-rust-verification:
    name: Linux
    runs-on: ubuntu-24.04
    # The uncached complete migration run took twelve minutes with repeated measurements.
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Admit Rust cache authority
        id: cache-policy
        env:
          POLICY: ${{ inputs.cache_policy }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TAG: ${{ inputs.release_tag }}
        run: |
          save=false
          case "$POLICY" in
            read-only) ;;
            pull-request)
              test "$EVENT" = pull_request
              [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
              test "$REF" = "refs/pull/$PR_NUMBER/merge"
              test -z "$SOURCE_SHA$TAG"
              save=true
              ;;
            main-seed)
              test "$REF" = refs/heads/main
              case "$EVENT" in push | workflow_dispatch) ;; *) exit 1 ;; esac
              test -z "$SOURCE_SHA$TAG"
              save=true
              ;;
            *) exit 1 ;;
          esac
          echo "save=$save" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "v2026.9.8"
          sha256: ff182b17e78d2ae09b5ae3ff3c032eed061e6c2a6b2d4a03ce959d4d74c4b7dd # linux-x64
          cache: false
          install: true

      - name: Admit the complete verification source capability
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CACHE_POLICY: ${{ inputs.cache_policy }}
          SEED_BUNDLE_CACHE: "false"
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from "node:fs";
          const tasks = readFileSync("mise.toml", "utf8");
          const task = (name) => tasks.includes(`[tasks."${name}"]`);
          const modern = [
            existsSync("scripts/macos-build-contract.ts"),
            existsSync("scripts/macos-bundle-build.ts"),
            existsSync("mise-tasks/verify/macos-bundle.ts"),
            task("verify:macos"), task("verify:shared-rust"), task("build:macos-bundle"),
          ];
          const legacy = [
            existsSync("mise-tasks/verify/bundle.ts"),
            task("verify:native"), task("verify:common"),
          ];
          let generation;
          if (modern.every(Boolean) && !legacy.some(Boolean)) {
            generation = "current";
          } else if (!modern.some(Boolean) && legacy.every(Boolean) &&
            process.env.RELEASE_TAG && /^[a-f0-9]{40}$/.test(process.env.SOURCE_SHA ?? "") &&
            process.env.CACHE_POLICY === "read-only" && process.env.SEED_BUNDLE_CACHE === "false") {
            generation = "legacy";
          } else {
            throw new Error("Incomplete or unauthorized verification source capability");
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `generation=${generation}\n`);
          NODE

      - name: Install common-shell system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          rustup target add aarch64-apple-darwin

      - name: Restore verified frontend assets
        if: inputs.frontend_artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.frontend_artifact }}
          path: .

      - name: Verify frontend artifact source and contents
        if: inputs.frontend_artifact != ''
        run: node scripts/frontend-artifact.ts check

      - name: Verify and build the frontend for standalone execution
        if: inputs.frontend_artifact == ''
        run: |
          pnpm install --frozen-lockfile
          mise run verify:portable

      - name: Restore common Rust dependency artifacts
        if: steps.source.outputs.generation == 'current'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: lens-v3-rust
          shared-key: common-x86_64-unknown-linux-gnu-${{ hashFiles('mise.lock', 'Cargo.toml') }}
          workspaces: . -> target
          cache-targets: true
          cache-bin: false
          cache-on-failure: false
          cache-all-crates: false
          cache-workspace-crates: false
          save-if: ${{ steps.cache-policy.outputs.save == 'true' }}

      - name: Verify normal common code, tests and native-feature compatibility
        env:
          VERIFY_TASK: ${{ steps.source.outputs.generation == 'legacy' && 'verify:common' || 'verify:shared-rust' }}
        run: mise run "$VERIFY_TASK"
