name: Rust Cache Seed

on:
  push:
    branches:
      - main
    paths:
      - .cargo/config.toml
      - .github/workflows/code-quality.yml
      - .github/workflows/native-quality.yml
      - .github/workflows/rust-cache-seed.yml
      - Cargo.toml
      - Cargo.lock
      - mise.lock
      - mise.toml
      - package.json
      - rust-toolchain
      - rust-toolchain.toml
      - src-tauri/**/.cargo/config.toml
      - src-tauri/**/Cargo.toml
      - packages/**/Cargo.toml
  workflow_dispatch:
    inputs:
      linux_common:
        description: Run bounded Linux common verification instead of seeding native caches.
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: rust-cache-seed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-quality:
    name: native-dependency-cache-seed
    if: github.ref == 'refs/heads/main' && !inputs.linux_common
    uses: ./.github/workflows/native-quality.yml
    with:
      save_cache: true

  reject-untrusted-cache-seed:
    if: github.ref != 'refs/heads/main' && !inputs.linux_common
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          echo '::error::Native dependency caches may only be seeded from main.'
          exit 1

  linux-common:
    if: github.event_name == 'workflow_dispatch' && inputs.linux_common
    uses: ./.github/workflows/linux-common.yml
