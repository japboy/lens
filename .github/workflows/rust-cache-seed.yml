name: Rust Cache Seed

on:
  push:
    branches:
      - main
    paths:
      - .cargo/config.toml
      - .github/workflows/code-quality.yml
      - .github/workflows/macos-verification.yml
      - .github/workflows/shared-rust-verification.yml
      - .github/workflows/rust-cache-seed.yml
      - Cargo.toml
      - Cargo.lock
      - mise.lock
      - mise.toml
      - package.json
      - pnpm-lock.yaml
      - scripts/macos-build-contract.ts
      - scripts/macos-bundle-build.ts
      - scripts/workspace-policy.ts
      - scripts/run-workspace-variant.ts
      - scripts/release/bundle.ts
      - scripts/release/version.ts
      - scripts/release/toml.ts
      - mise-tasks/inspect/features.ts
      - mise-tasks/verify/macos-bundle.ts
      - apps/desktop/src-tauri/tauri.conf.json
      - apps/desktop/src-tauri/tauri.macos.conf.json
      - apps/desktop/src-tauri/tauri.release.conf.json
      - rust-toolchain
      - rust-toolchain.toml
      - apps/desktop/src-tauri/**/.cargo/config.toml
      - apps/desktop/src-tauri/**/Cargo.toml
      - packages/**/Cargo.toml
  workflow_dispatch:
    inputs:
      shared_rust:
        description: Run bounded Linux common verification instead of seeding native caches.
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: rust-cache-seed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-verification:
    name: Verify cache seed source and frontend
    if: github.ref == 'refs/heads/main' && !inputs.shared_rust
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: "v2026.10.17"
          sha256: fe6dd17e68e09682b31d2e7bb7bb755d22636ac1af5d94621e300f2ca9e9fe8a
          cache: false
          install: true

      - run: pnpm install --frozen-lockfile
      - run: mise run verify:portable
      - run: node scripts/frontend-artifact.ts write
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cache-frontend-${{ github.sha }}
          path: |
            apps/desktop/.build/webview
            target/ci/frontend-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  macos-dependency-cache-seed:
    name: macOS dependency cache seed
    needs: frontend-verification
    if: github.ref == 'refs/heads/main' && !inputs.shared_rust
    uses: ./.github/workflows/macos-verification.yml
    with:
      cache_policy: main-seed
      seed_bundle_cache: true
      frontend_artifact: cache-frontend-${{ github.sha }}

  linux-dependency-cache-seed:
    needs: frontend-verification
    if: github.ref == 'refs/heads/main' && !inputs.shared_rust
    uses: ./.github/workflows/shared-rust-verification.yml
    with:
      cache_policy: main-seed
      frontend_artifact: cache-frontend-${{ github.sha }}

  reject-untrusted-cache-seed:
    if: github.ref != 'refs/heads/main' && !inputs.shared_rust
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          echo '::error::Native dependency caches may only be seeded from main.'
          exit 1

  shared-rust-verification:
    if: github.event_name == 'workflow_dispatch' && inputs.shared_rust
    uses: ./.github/workflows/shared-rust-verification.yml
