name: Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      controller_sha:
        required: true
        type: string
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preflight:
    permissions:
      contents: write
      actions: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.preflight.outputs.source_sha }}
      state: ${{ steps.preflight.outputs.state }}
      artifact_id: ${{ steps.preflight.outputs.artifact_id }}
      artifact_run_id: ${{ steps.preflight.outputs.artifact_run_id }}
      previous_tag: ${{ steps.preflight.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.controller_sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "v2026.9.8"
          sha256: ff182b17e78d2ae09b5ae3ff3c032eed061e6c2a6b2d4a03ce959d4d74c4b7dd # linux-x64
          cache: false
          install: true
      - id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CONTROLLER_SHA: ${{ inputs.controller_sha }}
        run: node scripts/release/cli.ts preflight

  portable:
    needs: preflight
    if: needs.preflight.outputs.state == 'build'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      frontend_artifact: ${{ steps.frontend.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "v2026.9.8"
          sha256: ff182b17e78d2ae09b5ae3ff3c032eed061e6c2a6b2d4a03ce959d4d74c4b7dd # linux-x64
          cache: false
          install: true
      - run: pnpm install --frozen-lockfile
      - run: mise run verify:portable
      - id: frontend
        env:
          ARTIFACT_NAME: release-frontend-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node scripts/frontend-artifact.ts write
          echo "name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/desktop/.build/webview
            target/ci/frontend-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  common:
    needs: [preflight, portable]
    permissions:
      contents: read
    uses: ./.github/workflows/shared-rust-verification.yml
    with:
      release_tag: ${{ inputs.tag }}
      source_sha: ${{ needs.preflight.outputs.source_sha }}
      frontend_artifact: ${{ needs.portable.outputs.frontend_artifact }}
      save_cache: false

  native:
    needs: [preflight, portable]
    permissions:
      contents: read
    uses: ./.github/workflows/macos-verification.yml
    with:
      source_sha: ${{ needs.preflight.outputs.source_sha }}
      frontend_artifact: ${{ needs.portable.outputs.frontend_artifact }}
      verification_mode: dmg
      controller_sha: ${{ inputs.controller_sha }}
      release_tag: ${{ inputs.tag }}
      previous_tag: ${{ needs.preflight.outputs.previous_tag }}
      save_cache: false

  publication-policy:
    needs: preflight
    if: vars.RELEASE_PUBLISH_ENABLED == 'true' && contains(fromJSON('["build","reuse","durable"]'), needs.preflight.outputs.state)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # No repository checkout or repository code runs with this metadata token.
      - id: policy-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
      - name: Require immutable release settings
        env:
          GH_TOKEN: ${{ steps.policy-token.outputs.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled or .enforced_by_owner')" = true

  release-verification:
    name: release-verification
    outputs:
      verification_attempt: ${{ steps.verified.outputs.attempt }}
    needs: [preflight, portable, common, native]
    if: always() && needs.preflight.outputs.state == 'build'
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require all source and package verification
        id: verified
        env:
          RESULTS: ${{ needs.portable.result }}:${{ needs.common.result }}:${{ needs.native.result }}
        run: |
          test "$RESULTS" = success:success:success
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  verified-artifact:
    needs: [preflight, native, release-verification]
    if: needs.preflight.outputs.state == 'build'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    outputs:
      artifact_id: ${{ steps.original.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.controller_sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "v2026.9.8"
          sha256: ff182b17e78d2ae09b5ae3ff3c032eed061e6c2a6b2d4a03ce959d4d74c4b7dd
          cache: false
          install: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.native.outputs.artifact_id }}
          path: target/release-artifact
          merge-multiple: true
      - name: Bind the successful verification attempt to the original build
        env:
          VERIFICATION_ATTEMPT: ${{ needs.release-verification.outputs.verification_attempt }}
          CONTROLLER_SHA: ${{ inputs.controller_sha }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release/cli.ts promote
      - name: Attest the complete recovery bundle after verification
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/release-artifact/release-recovery.json
      - name: Preserve the distribution only after all verification succeeds
        id: original
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ inputs.tag }}
          path: target/release-artifact
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [preflight, verified-artifact, release-verification, publication-policy]
    if: always() && needs.preflight.result == 'success' && (contains(fromJSON('["reuse","durable"]'), needs.preflight.outputs.state) || (needs.preflight.outputs.state == 'build' && needs.release-verification.result == 'success' && needs.verified-artifact.result == 'success')) && (vars.RELEASE_PUBLISH_ENABLED != 'true' || needs.publication-policy.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.controller_sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "v2026.9.8"
          sha256: ff182b17e78d2ae09b5ae3ff3c032eed061e6c2a6b2d4a03ce959d4d74c4b7dd # linux-x64
          cache: false
          install: true
      - name: Retrieve the exact original artifact by ID
        if: contains(fromJSON('["build","reuse"]'), needs.preflight.outputs.state)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.preflight.outputs.artifact_id || needs.verified-artifact.outputs.artifact_id }}
          run-id: ${{ needs.preflight.outputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: target/release-artifact
          merge-multiple: true
      - name: Verify, resume the matching draft, and conditionally publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CONTROLLER_SHA: ${{ inputs.controller_sha }}
          RELEASE_PUBLISH_ENABLED: ${{ vars.RELEASE_PUBLISH_ENABLED }}
          IMMUTABILITY_RESULT: ${{ needs.publication-policy.result }}
          RECOVERY_STATE: ${{ needs.preflight.outputs.state }}
        run: node scripts/release/cli.ts publish
