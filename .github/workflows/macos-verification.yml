name: macOS Verification

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact verified source; defaults to the caller revision for ordinary CI.
        type: string
        default: ""
      controller_sha:
        description: Trusted release controller revision, distinct from product source.
        type: string
        default: ""
      release_tag:
        type: string
        default: ""
      previous_tag:
        type: string
        default: ""
      verification_mode:
        description: macOS code checks, or checks plus an app or DMG.
        type: string
        default: code
      seed_bundle_cache:
        description: Populate packaged-build dependencies on trusted main without creating a distribution.
        type: boolean
        default: false
      frontend_artifact:
        description: Same-workflow frontend artifact bound to the tested SHA.
        type: string
        default: ""
      cache_policy:
        description: "Cache authority: read-only, pull-request, or main-seed."
        type: string
        default: read-only

    outputs:
      artifact_id:
        value: ${{ jobs.macos-verification.outputs.artifact_id }}
        description: Verified release artifact ID from this run.

permissions:
  contents: read

jobs:
  macos-verification:
    name: ${{ inputs.seed_bundle_cache && 'code and bundle cache' || inputs.verification_mode }}
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.release-artifact.outputs.artifact-id }}
    steps:
      - name: Admit Rust cache authority
        id: cache-policy
        env:
          POLICY: ${{ inputs.cache_policy }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TAG: ${{ inputs.release_tag }}
        run: |
          save=false
          case "$POLICY" in
            read-only) ;;
            pull-request)
              test "$EVENT" = pull_request
              [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
              test "$REF" = "refs/pull/$PR_NUMBER/merge"
              test -z "$SOURCE_SHA$TAG"
              save=true
              ;;
            main-seed)
              test "$REF" = refs/heads/main
              case "$EVENT" in push | workflow_dispatch) ;; *) exit 1 ;; esac
              test -z "$SOURCE_SHA$TAG"
              save=true
              ;;
            *) exit 1 ;;
          esac
          echo "save=$save" >> "$GITHUB_OUTPUT"
      - name: Validate native verification mode
        env:
          MODE: ${{ inputs.verification_mode }}
          TAG: ${{ inputs.release_tag }}
          ARTIFACT: ${{ inputs.frontend_artifact }}
          SEED: ${{ inputs.seed_bundle_cache }}
          POLICY: ${{ inputs.cache_policy }}
          REF: ${{ github.ref }}
        run: |
          case "$MODE" in
            code) ;;
            app | dmg) test -n "$ARTIFACT" ;;
            *) exit 1 ;;
          esac
          if test -n "$TAG"; then test "$MODE" = dmg; fi
          if test "$POLICY" = main-seed; then test "$SEED" = true; fi
          if test "$SEED" = true; then
            test "$REF:$POLICY:$MODE" = refs/heads/main:main-seed:code
            test -n "$ARTIFACT"
            test -z "$TAG"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: "v2026.10.17" # Exact release tag required for Renovate's paired checksum lookup.
          sha256: 9e27709db5eb1e900d83149418d3067309f2a5004d4994d94246ab658ba4a3ce # macos-arm64
          cache: false
          install: true

      - name: Admit the complete verification source capability
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CACHE_POLICY: ${{ inputs.cache_policy }}
          SEED_BUNDLE_CACHE: ${{ inputs.seed_bundle_cache }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from "node:fs";
          const tasks = readFileSync("mise.toml", "utf8");
          const task = (name) => tasks.includes(`[tasks."${name}"]`);
          const modern = [
            existsSync("scripts/macos-build-contract.ts"),
            existsSync("scripts/macos-bundle-build.ts"),
            existsSync("mise-tasks/verify/macos-bundle.ts"),
            task("verify:macos"), task("verify:shared-rust"), task("build:macos-bundle"),
          ];
          const legacy = [
            existsSync("mise-tasks/verify/bundle.ts"),
            task("verify:native"), task("verify:common"),
          ];
          let generation;
          if (modern.every(Boolean) && !legacy.some(Boolean)) {
            generation = "current";
          } else if (!modern.some(Boolean) && legacy.every(Boolean) &&
            process.env.RELEASE_TAG && /^[a-f0-9]{40}$/.test(process.env.SOURCE_SHA ?? "") &&
            process.env.CACHE_POLICY === "read-only" && process.env.SEED_BUNDLE_CACHE === "false") {
            generation = "legacy";
          } else {
            throw new Error("Incomplete or unauthorized verification source capability");
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `generation=${generation}\n`);
          NODE

      - name: Install the pinned source build-policy dependencies
        if: steps.source.outputs.generation == 'current'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Resolve the macOS build and cache contract
        if: steps.source.outputs.generation == 'current'
        id: contract
        run: node scripts/macos-build-contract.ts

      - name: Restore Rust dependency artifacts
        id: rust-cache
        if: steps.source.outputs.generation == 'current'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: lens-v3-rust
          shared-key: macos-aarch64-apple-darwin-${{ (inputs.seed_bundle_cache || inputs.verification_mode != 'code') && 'code-and-bundle-v1' || 'code-v1' }}-${{ steps.contract.outputs.cache_key }}
          env-vars: MACOSX_DEPLOYMENT_TARGET
          workspaces: . -> target
          cache-targets: true
          cache-bin: false
          cache-on-failure: false
          cache-all-crates: false
          cache-workspace-crates: false
          save-if: ${{ steps.cache-policy.outputs.save == 'true' }}

      # Exact caches are immutable. Code-only runs must not occupy the complete
      # packaged-build key; a read-only fallback reuses the other coverage on a miss.
      - name: Restore compatible dependencies from the other build coverage
        if: steps.source.outputs.generation == 'current' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: lens-v3-rust
          shared-key: macos-aarch64-apple-darwin-${{ (inputs.seed_bundle_cache || inputs.verification_mode != 'code') && 'code-v1' || 'code-and-bundle-v1' }}-${{ steps.contract.outputs.cache_key }}
          env-vars: MACOSX_DEPLOYMENT_TARGET
          workspaces: . -> target
          cache-targets: true
          cache-bin: false
          cache-on-failure: false
          cache-all-crates: false
          cache-workspace-crates: false
          save-if: false

      - name: Run native verification
        env:
          VERIFY_TASK: ${{ steps.source.outputs.generation == 'legacy' && 'verify:native' || 'verify:macos' }}
        run: mise run "$VERIFY_TASK"

      - name: Restore the verified frontend artifact
        if: inputs.verification_mode != 'code' || inputs.seed_bundle_cache
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.frontend_artifact }}
          path: .

      - name: Verify frontend artifact source and contents
        if: inputs.verification_mode != 'code' || inputs.seed_bundle_cache
        run: node scripts/frontend-artifact.ts check

      - name: Populate packaged Rust dependency artifacts
        if: inputs.seed_bundle_cache
        run: mise run build:macos-bundle

      - name: Install the pinned native bundler
        if: inputs.verification_mode != 'code'
        run: pnpm install --frozen-lockfile

      - name: Build and verify the native application bundle
        if: inputs.verification_mode != 'code'
        env:
          BUNDLE_KIND: ${{ inputs.verification_mode }}
          BUNDLE_TASK: ${{ steps.source.outputs.generation == 'legacy' && 'verify:bundle' || 'verify:macos-bundle' }}
        run: mise run "$BUNDLE_TASK" -- "$BUNDLE_KIND"

      - name: Verify the actual ACP helper process lifecycle
        if: steps.source.outputs.generation == 'current' && (inputs.verification_mode != 'code' || inputs.seed_bundle_cache)
        env:
          LENS_TEST_EXECUTABLE: ${{ github.workspace }}/target/aarch64-apple-darwin/release/lens
        run: >-
          cargo test --locked --target aarch64-apple-darwin
          --package domain --package port-platform --package usecase --package desktop
          --package adapter-mcp-server --package adapter-platform-macos
          --lib --bins --profile test agent_launch::tests::actual_helper_
          -- --ignored --test-threads=1

      - name: Check out the trusted release controller separately
        if: inputs.release_tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.controller_sha }}
          path: target/release-controller
          persist-credentials: false

      - name: Install the pinned release controller dependencies
        if: inputs.release_tag != ''
        run: pnpm --dir target/release-controller install --frozen-lockfile --ignore-scripts

      - name: Package immutable source-bound release evidence
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          CONTROLLER_SHA: ${{ inputs.controller_sha }}
          SOURCE_ROOT: ${{ github.workspace }}
        run: node target/release-controller/scripts/release/cli.ts package

      - name: Preserve the original verified distribution
        if: inputs.release_tag != ''
        id: release-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ inputs.release_tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/release-artifact
          if-no-files-found: error
          retention-days: 1
