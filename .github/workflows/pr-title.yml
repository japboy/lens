name: PR Title

# The squash title is the only thing an edit to a pull request's metadata can invalidate,
# and checking it costs under a second. It lives here so that `code-quality` does not have
# to run on `edited`: that trigger fires for a description or base change too, and with
# `cancel-in-progress` it discarded a healthy in-flight macOS and Linux matrix and started
# the whole plan again.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "v2026.8.10" # Exact release tag required for Renovate's paired checksum lookup.
          sha256: 1f5e8795d24073904ef20ba70c1250ad6389d8c5672226d152e0ed24909ba72f # linux-x64
          cache: false
          install: true

      - name: Validate the squash commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/release/cli.ts pr-title
