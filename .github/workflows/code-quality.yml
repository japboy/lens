name: Code Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-verification:
    name: Repository rules and tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      shared_rust: ${{ steps.plan.outputs.shared_rust }}
      macos: ${{ steps.plan.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "v2026.9.8" # Exact release tag required for Renovate's paired checksum lookup.
          sha256: ff182b17e78d2ae09b5ae3ff3c032eed061e6c2a6b2d4a03ce959d4d74c4b7dd # linux-x64
          cache: false
          install: true

      - name: Validate the squash commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/release/cli.ts pr-title

      - run: pnpm install --frozen-lockfile

      - name: Validate the complete release delta against the tested base
        if: github.event.pull_request.head.ref == 'release-please--branches--main--components--lens'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/release/cli.ts delta

      - run: mise run verify:repository

      - name: Classify the complete tested merge-ref change set
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-diff.ts

  frontend-verification:
    name: Frontend verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "v2026.9.8" # Exact release tag required for Renovate's paired checksum lookup.
          sha256: ff182b17e78d2ae09b5ae3ff3c032eed061e6c2a6b2d4a03ce959d4d74c4b7dd # linux-x64
          cache: false
          install: true

      - run: pnpm install --frozen-lockfile

      - run: mise run verify:frontend

      - name: Bind frontend assets to the tested source
        run: node scripts/frontend-artifact.ts write

      - name: Share verified frontend assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-${{ github.sha }}
          path: |
            apps/desktop/.build/webview
            target/ci/frontend-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  shared-rust-verification:
    name: Shared Rust verification
    needs: [repository-verification, frontend-verification]
    if: needs.repository-verification.outputs.shared_rust == 'true'
    uses: ./.github/workflows/shared-rust-verification.yml
    with:
      frontend_artifact: frontend-${{ github.sha }}
      save_cache: false

  macos-verification:
    name: macOS verification
    needs: [repository-verification, frontend-verification]
    if: contains(fromJSON('["code","app","dmg"]'), needs.repository-verification.outputs.macos)
    uses: ./.github/workflows/macos-verification.yml
    with:
      save_cache: false
      verification_mode: ${{ needs.repository-verification.outputs.macos }}
      frontend_artifact: frontend-${{ github.sha }}

  code-quality:
    name: code-quality
    needs:
      - repository-verification
      - frontend-verification
      - shared-rust-verification
      - macos-verification
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SHARED_RUST: ${{ needs.repository-verification.outputs.shared_rust }}
      MACOS: ${{ needs.repository-verification.outputs.macos }}
      REPOSITORY_RESULT: ${{ needs.repository-verification.result }}
      FRONTEND_RESULT: ${{ needs.frontend-verification.result }}
      SHARED_RUST_RESULT: ${{ needs.shared-rust-verification.result }}
      MACOS_RESULT: ${{ needs.macos-verification.result }}
    steps:
      - name: Require the complete verification state
        run: |
          case "$REPOSITORY_RESULT:$FRONTEND_RESULT:$SHARED_RUST_RESULT:$MACOS_RESULT:$SHARED_RUST:$MACOS" in
            success:success:skipped:skipped:false:none | success:success:success:skipped:true:none | success:success:success:success:true:code | success:success:success:success:true:app | success:success:success:success:true:dmg)
              echo "Code quality passed: shared Rust=$SHARED_RUST macOS=$MACOS"
              ;;
            *)
              echo "::error::Incomplete verification: repository=$REPOSITORY_RESULT frontend=$FRONTEND_RESULT shared Rust=$SHARED_RUST_RESULT macOS=$MACOS_RESULT requirements=$SHARED_RUST:$MACOS"
              exit 1
              ;;
          esac
