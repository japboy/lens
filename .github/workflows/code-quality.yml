name: Code Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-verification:
    name: Repository rules and tooling
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      shared_rust: ${{ steps.plan.outputs.shared_rust }}
      macos: ${{ steps.plan.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: "v2026.11.8" # Exact release tag required for Renovate's paired checksum lookup.
          sha256: 32b6abe844efa43d37d7ac4ed21d2ec41e9479d66feb19b0db8d2c548cd6e36d # linux-x64
          cache: false
          install: true

      - name: Validate the squash commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/release/cli.ts pr-title

      - run: pnpm install --frozen-lockfile

      - name: Validate the complete release delta against the tested base
        if: github.event.pull_request.head.ref == 'release-please--branches--main--components--lens'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/release/cli.ts delta

      - name: Preserve verified managed bootstrap identities across updates
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/managed-runtime-history.ts

      - run: mise run verify:repository

      - name: Classify the complete tested merge-ref change set
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-diff.ts

  frontend-verification:
    name: Frontend verification
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: "v2026.11.8" # Exact release tag required for Renovate's paired checksum lookup.
          sha256: 32b6abe844efa43d37d7ac4ed21d2ec41e9479d66feb19b0db8d2c548cd6e36d # linux-x64
          cache: false
          install: true

      - run: pnpm install --frozen-lockfile

      - run: mise run verify:frontend

      - name: Bind frontend assets to the tested source
        run: node scripts/frontend-artifact.ts write

      - name: Share verified frontend assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-${{ github.sha }}
          path: |
            apps/desktop/.build/webview
            target/ci/frontend-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  shared-rust-verification:
    name: Shared Rust verification
    needs: [repository-verification, frontend-verification]
    if: needs.repository-verification.outputs.shared_rust == 'true'
    uses: ./.github/workflows/shared-rust-verification.yml
    with:
      frontend_artifact: frontend-${{ github.sha }}
      cache_policy: pull-request

  macos-verification:
    name: macOS verification
    needs: [repository-verification, frontend-verification]
    if: contains(fromJSON('["code","app","dmg"]'), needs.repository-verification.outputs.macos)
    uses: ./.github/workflows/macos-verification.yml
    with:
      cache_policy: pull-request
      verification_mode: ${{ needs.repository-verification.outputs.macos }}
      frontend_artifact: frontend-${{ github.sha }}

  windows-fixture-verification:
    name: Windows fixture verification
    needs: [repository-verification]
    if: needs.repository-verification.outputs.shared_rust == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: "v2026.11.8"
          sha256: 8508adc6016766833c985f0770c136df7816c495b2e82318f8ad9c58af0c0511 # windows-x64 mise.exe
          cache: false
          install: true
          install_args: node pnpm rust

      - run: pnpm install --frozen-lockfile

      # Compile only the owned helpers and embedded validation shell. No picker,
      # acquisition, Agent, product frontend or packaging is run on the CI desktop.
      - name: Compile the owned Windows fixture
        run: |
          & ./packages/adapter-platform-windows/fixtures/build.ps1 -OutputDirectory target/windows-fixture-binaries
          node scripts/run-workspace-variant.ts windows-fixture-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test and lint the Windows fixture adapter
        run: |
          cargo test --locked --target x86_64-pc-windows-msvc -p adapter-platform-windows --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --target x86_64-pc-windows-msvc -p adapter-platform-windows --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  code-quality:
    name: code-quality
    needs:
      - repository-verification
      - frontend-verification
      - shared-rust-verification
      - macos-verification
      - windows-fixture-verification
    if: always() && github.event.pull_request.state == 'open'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SHARED_RUST: ${{ needs.repository-verification.outputs.shared_rust }}
      MACOS: ${{ needs.repository-verification.outputs.macos }}
      REPOSITORY_RESULT: ${{ needs.repository-verification.result }}
      FRONTEND_RESULT: ${{ needs.frontend-verification.result }}
      SHARED_RUST_RESULT: ${{ needs.shared-rust-verification.result }}
      MACOS_RESULT: ${{ needs.macos-verification.result }}
      WINDOWS_FIXTURE_RESULT: ${{ needs.windows-fixture-verification.result }}
    steps:
      - name: Require the complete verification state
        run: |
          case "$SHARED_RUST:$WINDOWS_FIXTURE_RESULT" in
            true:success | false:skipped) ;;
            *)
              echo "::error::Incomplete Windows fixture verification: required=$SHARED_RUST result=$WINDOWS_FIXTURE_RESULT"
              exit 1
              ;;
          esac
          case "$REPOSITORY_RESULT:$FRONTEND_RESULT:$SHARED_RUST_RESULT:$MACOS_RESULT:$SHARED_RUST:$MACOS" in
            success:success:skipped:skipped:false:none | success:success:success:skipped:true:none | success:success:success:success:true:code | success:success:success:success:true:app | success:success:success:success:true:dmg)
              echo "Code quality passed: shared Rust=$SHARED_RUST macOS=$MACOS"
              ;;
            *)
              echo "::error::Incomplete verification: repository=$REPOSITORY_RESULT frontend=$FRONTEND_RESULT shared Rust=$SHARED_RUST_RESULT macOS=$MACOS_RESULT requirements=$SHARED_RUST:$MACOS"
              exit 1
              ;;
          esac
