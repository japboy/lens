name: Code Quality

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-quality:
    name: portable-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      impact: ${{ steps.impact.outputs.impact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "v2026.8.10" # Exact release tag required for Renovate's paired checksum lookup.
          sha256: 1f5e8795d24073904ef20ba70c1250ad6389d8c5672226d152e0ed24909ba72f # linux-x64
          cache: false
          install: true

      - name: Classify change impact
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" | node scripts/classify-ci-impact.ts

      - run: pnpm install --frozen-lockfile

      - run: pnpm run verify:portable

  native-quality:
    name: native-quality
    needs: portable-quality
    if: needs.portable-quality.outputs.impact == 'native-or-control-plane'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "v2026.8.10" # Exact release tag required for Renovate's paired checksum lookup.
          sha256: a91ccafc1a90087c94c4c70bd61b455bfae087b899c1e5619f4ef515aa2e036f # macos-arm64
          cache: false
          install: true

      - run: pnpm run verify:native

  code-quality:
    name: code-quality
    needs:
      - portable-quality
      - native-quality
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      IMPACT: ${{ needs.portable-quality.outputs.impact }}
      NATIVE_RESULT: ${{ needs.native-quality.result }}
      PORTABLE_RESULT: ${{ needs.portable-quality.result }}
    steps:
      - name: Require the complete verification state
        run: |
          case "$PORTABLE_RESULT:$NATIVE_RESULT:$IMPACT" in
            success:skipped:portable-only | success:success:native-or-control-plane)
              echo "Code quality passed for impact state: $IMPACT"
              ;;
            *)
              echo "::error::Incomplete code-quality state: portable=$PORTABLE_RESULT native=$NATIVE_RESULT impact=$IMPACT"
              exit 1
              ;;
          esac
