name: Native Quality

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact verified source; defaults to the caller revision for ordinary CI.
        type: string
        default: ""
      bundle_kind:
        type: string
        default: app
      release_tag:
        type: string
        default: ""
      previous_tag:
        type: string
        default: ""
      native_mode:
        description: Native checks, or checks plus the signed application bundle.
        type: string
        default: code
      frontend_artifact:
        description: Same-workflow frontend artifact bound to the tested SHA.
        type: string
        default: ""
      save_cache:
        description: Save a trusted default-branch Rust dependency cache after verification.
        required: true
        type: boolean

    outputs:
      artifact_id:
        value: ${{ jobs.native-quality.outputs.artifact_id }}
        description: Verified release artifact ID from this run.

permissions:
  contents: read

jobs:
  native-quality:
    name: native-quality
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.release-artifact.outputs.artifact-id }}
    steps:
      - name: Validate native verification mode
        env:
          MODE: ${{ inputs.native_mode }}
          KIND: ${{ inputs.bundle_kind }}
          TAG: ${{ inputs.release_tag }}
          ARTIFACT: ${{ inputs.frontend_artifact }}
        run: |
          case "$KIND" in app | dmg) ;; *) exit 1 ;; esac
          if test -n "$TAG"; then test "$KIND:$MODE" = "dmg:bundle"; fi
          case "$MODE" in
            code) ;;
            bundle) test -n "$ARTIFACT" ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "v2026.8.16" # Exact release tag required for Renovate's paired checksum lookup.
          sha256: 59daf6d3d81846f5e190b3e8e30e06aaf003b48afd6619151bfd5df1829c75f4 # macos-arm64
          cache: false
          install: true

      - name: Restore Rust dependency artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: lens-v3-rust
          shared-key: native-aarch64-apple-darwin
          key: ${{ hashFiles('mise.lock', 'scripts/workspace-variants.json') }}
          workspaces: . -> target
          cache-targets: true
          cache-bin: false
          cache-on-failure: false
          cache-all-crates: false
          cache-workspace-crates: false
          save-if: ${{ inputs.save_cache && github.ref == 'refs/heads/main' }}

      - name: Run native verification without JavaScript dependencies
        run: mise run verify:native

      - name: Restore the verified frontend artifact
        if: inputs.native_mode == 'bundle'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.frontend_artifact }}
          path: .

      - name: Verify frontend artifact source and contents
        if: inputs.native_mode == 'bundle'
        run: node scripts/frontend-artifact.ts check

      - name: Install the pinned native bundler
        if: inputs.native_mode == 'bundle'
        run: pnpm install --frozen-lockfile

      - name: Build and verify the native application bundle
        if: inputs.native_mode == 'bundle'
        env:
          BUNDLE_KIND: ${{ inputs.bundle_kind }}
        run: mise run verify:bundle -- "$BUNDLE_KIND"

      - name: Package immutable source-bound release evidence
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: node scripts/release/cli.ts package

      - name: Preserve the original verified distribution
        if: inputs.release_tag != ''
        id: release-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ inputs.release_tag }}
          path: target/release-artifact
          if-no-files-found: error
          retention-days: 30
