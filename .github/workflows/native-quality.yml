name: Native Quality

on:
  workflow_call:
    inputs:
      save_cache:
        description: Save a trusted default-branch Rust dependency cache after verification.
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  native-quality:
    name: native-quality
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "v2026.8.10" # Exact release tag required for Renovate's paired checksum lookup.
          sha256: a91ccafc1a90087c94c4c70bd61b455bfae087b899c1e5619f4ef515aa2e036f # macos-arm64
          cache: false
          install: true

      - name: Restore Rust dependency artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: lens-v2-rust
          shared-key: native-dependencies
          workspaces: . -> target
          cache-targets: true
          cache-bin: false
          cache-on-failure: false
          cache-all-crates: false
          cache-workspace-crates: false
          save-if: ${{ inputs.save_cache && github.ref == 'refs/heads/main' }}

      - name: Run native verification without JavaScript dependencies
        run: mise run verify:native
