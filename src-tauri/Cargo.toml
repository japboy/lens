[package]
name = "personal-lens"
version = "0.1.0"
description = "Accessibility-first personal information lens for macOS"
authors = ["PersonalLens contributors"]
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
name = "personal_lens_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "personal-lens"
path = "src/main.rs"

[build-dependencies]
cc = "1.2"
tauri-build = { version = "2.5", features = [] }

[dependencies]
agent-client-protocol = { version = "=2.0.0", features = ["unstable_auth_methods"] }
dirs = "6.0"
flate2 = "1.1"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tauri = { version = "2.11.5", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
pretty_assertions = "1"
