[package]
name = "lens"
version = "0.1.0"
description = "Accessibility-first personal information lens for macOS"
authors = ["Lens contributors"]
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "lens_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "lens"
path = "src/main.rs"

[build-dependencies]
cc = "1.2"
tauri-build = { version = "2.5", features = [] }

[dependencies]
agent-client-protocol = "=2.1.0"
base64 = "0.22"
dirs = "6.0"
flate2 = "1.1"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "=0.3.2"
sha2 = "0.11"
tar = "0.4"
tauri = { version = "2.11.5", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
pretty_assertions = "1"
