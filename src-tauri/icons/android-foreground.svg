<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" role="img" aria-labelledby="title desc">
  <title id="title">Lens</title>
  <desc id="desc">Smoked-glass material derived from the canonical Lens mark.</desc>
  <defs>
    <path id="shape-frame" fill-rule="evenodd" d="M 18 10 A 8 8 0 1 1 2 10 A 8 8 0 1 1 18 10 Z M 16.5 10 A 6.5 6.5 0 1 0 3.5 10 A 6.5 6.5 0 1 0 16.5 10 Z" />
    <path id="shape-lens-face-major" d="M 9.625 5.264825769 A 4.75 4.75 0 0 1 14.735174231 10.375 H 10.5 Q 9.625 10.375 9.625 9.5 Z" />
    <path id="shape-lens-face-crescent" d="M 7.125 6.218879134 A 4.75 4.75 0 1 0 13.781120866 12.875 H 10.5 Q 7.125 12.875 7.125 9.5 Z" />
    <linearGradient id="rim" x1="15%" y1="0%" x2="70%" y2="100%">
      <stop offset="0" stop-color="#979797" />
      <stop offset=".22" stop-color="#434343" />
      <stop offset=".62" stop-color="#222222" />
      <stop offset="1" stop-color="#727272" />
    </linearGradient>
    <linearGradient id="face" x1="10%" y1="0%" x2="75%" y2="100%">
      <stop offset="0" stop-color="#939393" />
      <stop offset="1" stop-color="#333333" />
    </linearGradient>
    <radialGradient id="sheen" cx="30%" cy="12%" r="85%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55" />
      <stop offset=".6" stop-color="#ffffff" stop-opacity=".03" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <clipPath id="mark-clip"><use href="#shape-frame" />
    <use href="#shape-lens-face-major" />
    <use href="#shape-lens-face-crescent" /></clipPath>
  </defs>
  <g transform="translate(10 10) scale(0.7407407407407407) translate(-10 -10)">
<g data-lens-mark="smoked-glass">
    <use href="#shape-frame" fill="url(#rim)" />
    <use href="#shape-lens-face-major" fill="url(#face)" />
    <use href="#shape-lens-face-crescent" fill="url(#face)" />
    <g clip-path="url(#mark-clip)" fill="none" stroke="url(#sheen)" stroke-width=".16">
      <use href="#shape-frame" />
    <use href="#shape-lens-face-major" />
    <use href="#shape-lens-face-crescent" />
    </g>
  </g>
</g>
</svg>
