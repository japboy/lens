packages:
  - "."

# Mermaid's declared range accepts this trusted-publisher release; newer
# Cytoscape releases are rejected by the workspace's no-downgrade policy.
overrides:
  cytoscape: 3.34.0

minimumReleaseAge: 4320
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
trustLockfile: false
blockExoticSubdeps: true
strictDepBuilds: true
allowBuilds:
  esbuild: true
verifyDepsBeforeRun: error
nodeVersion: 24.19.0
engineStrict: true
strictPeerDependencies: true
saveExact: true
