[workspace]
members = [
  "apps/desktop/src-tauri",
  "packages/domain",
  "packages/usecase",
  "packages/port-platform",
  "packages/adapter-platform-macos",
  "packages/adapter-mcp-server",
]
resolver = "2"

[workspace.package]
version = "0.8.3"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace.dependencies]
agent-client-protocol-schema = { version = "=1.9.1", features = ["tracing"] }
domain = { path = "packages/domain" }
usecase = { path = "packages/usecase" }
port-platform = { path = "packages/port-platform" }
adapter-mcp-server = { path = "packages/adapter-mcp-server" }
adapter-platform-macos = { path = "packages/adapter-platform-macos" }
base64 = "=0.23.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_json_canonicalizer = "=0.3.2"
sha2 = "=0.11.0"
thiserror = "=2.0.21"
url = "=2.5.8"
uuid = { version = "=1.27.0", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
