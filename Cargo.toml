[workspace]
members = [
  "apps/desktop/src-tauri",
  "packages/domain",
  "packages/usecase",
  "packages/port-platform",
  "packages/adapter-platform-macos",
  "packages/adapter-output-mcp",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
publish = false

[workspace.dependencies]
agent-client-protocol-schema = { version = "=1.7.0", features = ["tracing"] }
domain = { path = "packages/domain" }
usecase = { path = "packages/usecase" }
port-platform = { path = "packages/port-platform" }
adapter-output-mcp = { path = "packages/adapter-output-mcp" }
adapter-platform-macos = { path = "packages/adapter-platform-macos" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "=0.3.2"
sha2 = "0.11"
thiserror = "2"
url = "=2.5.8"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
