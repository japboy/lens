[workspace]
members = ["src-tauri", "packages/domain"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"
publish = false

[workspace.dependencies]
domain = { path = "packages/domain", version = "=0.1.0" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "=0.3.2"
sha2 = "0.11"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
