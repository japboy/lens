[graph]
targets = ["aarch64-apple-darwin"]
all-features = true

[advisories]
ignore = [
  { id = "RUSTSEC-2025-0075", reason = "Unmaintained transitive rust-unic crate from Tauri 2.11.5 through urlpattern 0.3.0; the advisory has no safe upgrade." },
  { id = "RUSTSEC-2025-0080", reason = "Unmaintained transitive rust-unic crate from Tauri 2.11.5 through urlpattern 0.3.0; the advisory has no safe upgrade." },
  { id = "RUSTSEC-2025-0081", reason = "Unmaintained transitive rust-unic crate from Tauri 2.11.5 through urlpattern 0.3.0; the advisory has no safe upgrade." },
  { id = "RUSTSEC-2025-0098", reason = "Unmaintained transitive rust-unic crate from Tauri 2.11.5 through urlpattern 0.3.0; the advisory has no safe upgrade." },
  { id = "RUSTSEC-2025-0100", reason = "Unmaintained transitive rust-unic crate from Tauri 2.11.5 through urlpattern 0.3.0; the advisory has no safe upgrade." },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
