[package]
name = "desktop"
version.workspace = true
description = "Accessibility-first personal information lens for macOS"
authors = ["Lens contributors"]
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "lens_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "lens"
path = "src/main.rs"

[features]
native-webview-lifecycle-test = []

[[test]]
name = "native_webview_lifecycle"
path = "tests/native_webview_lifecycle.rs"
harness = false
required-features = ["native-webview-lifecycle-test"]

[build-dependencies]
serde_json.workspace = true
toml = "=1.1.8"
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
usecase.workspace = true
port-platform.workspace = true
adapter-mcp-server.workspace = true
agent-client-protocol = { version = "=3.3.0", features = ["process"] }
base64.workspace = true
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
dirs = "=7.0.0"
flate2 = "=1.1.11"
libc = "=0.2.191"
nix = { version = "=0.31.3", features = ["feature", "fs", "poll", "process", "signal", "term"] }
reqwest = { workspace = true, default-features = true, features = ["stream"] }
rusqlite = { version = "=0.42.0", default-features = false, features = ["bundled"] }
semver = "=1.0.28"
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
shlex = "=2.0.1"
tar = "=0.4.46"
tempfile = "=3.27.0"
tauri = { version = "=2.12.5", default-features = false, features = [
  "image-png",
  "macos-private-api",
  "tray-icon",
  "compression",
  "common-controls-v6",
  "dynamic-acl",
  "x11",
  "dbus",
] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"
thiserror.workspace = true
tokio-util = "=0.7.20"
tokio = { version = "=1.54.1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "sync",
  "time",
] }
uuid.workspace = true
uzers = { version = "=0.12.2", default-features = false }
zip = { version = "=9.5.1", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tokio-util = { version = "=0.7.20", features = ["compat"] }
tokio = { version = "=1.54.1", features = ["test-util"] }
toml = "=1.1.8"
pretty_assertions = "=1.4.1"
tauri = { version = "=2.12.5", default-features = false, features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
adapter-platform-macos.workspace = true
tauri = { version = "=2.12.5", features = ["macos-private-api"] }

[lints]
workspace = true
