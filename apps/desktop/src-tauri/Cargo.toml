[package]
name = "desktop"
version.workspace = true
description = "Accessibility-first personal information lens for macOS"
authors = ["Lens contributors"]
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "lens_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "lens"
path = "src/main.rs"

[features]
native-webview-lifecycle-test = []

[[test]]
name = "native_webview_lifecycle"
path = "tests/native_webview_lifecycle.rs"
harness = false
required-features = ["native-webview-lifecycle-test"]

[build-dependencies]
serde_json.workspace = true
toml = "=1.1.6"
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
usecase.workspace = true
port-platform.workspace = true
adapter-mcp-server.workspace = true
agent-client-protocol = "=2.2.0"
base64.workspace = true
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
dirs = "=6.0.0"
flate2 = "=1.1.9"
libc = "=0.2.189"
reqwest = { workspace = true, default-features = true, features = ["stream"] }
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled"] }
semver = "=1.0.28"
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
shlex = "=2.0.1"
tar = "=0.4.46"
tempfile = "=3.27.0"
tauri = { version = "=2.12.0", default-features = false, features = [
  "image-png",
  "macos-private-api",
  "tray-icon",
  "compression",
  "common-controls-v6",
  "dynamic-acl",
  "x11",
  "dbus",
] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-opener = "=2.5.5"
thiserror.workspace = true
tokio-util = "=0.7.19"
tokio = { version = "=1.53.1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "sync",
  "time",
] }
uuid.workspace = true
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["test-util"] }
toml = "=1.1.6"
pretty_assertions = "=1.4.1"
tauri = { version = "=2.12.0", default-features = false, features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
adapter-platform-macos.workspace = true
tauri = { version = "=2.12.0", features = ["macos-private-api"] }
